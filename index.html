<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UFO Files"><meta name="theme-color" content="#05080f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>UFO Files</title>
<style>
:root{--bg:#05080f;--card:#0d1522;--line:#1b2a40;--g:#5dffb4;--t:#e6eef8;--m:#8aa0b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 500px at 50% -100px,#0f2a2e,var(--bg));color:var(--t);font:16px/1.4 -apple-system,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px}
h1{margin:0;font-size:28px;letter-spacing:.5px}h1 span{color:var(--g)}
.sub{color:var(--m);font-size:13px}
.search{display:flex;gap:8px;padding:8px 16px}
.search input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--t);border-radius:12px;padding:12px;font-size:16px}
.search button,.btn{background:var(--g);color:#032;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
main{padding:4px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.card a.t,.card .t{display:block;padding:14px 14px 4px;color:var(--t);text-decoration:none;font-weight:600}
.meta{padding:0 14px 12px;color:var(--m);font-size:12px}
.vid{aspect-ratio:16/9;width:100%;background:#000;border:0;display:block}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.status{color:var(--m);text-align:center;padding:30px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(8,13,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--m);font-size:11px;padding:6px 0}
nav button b{display:block;font-size:22px;font-weight:400}
nav button.on{color:var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
</style></head><body>
<header><h1>UFO <span>FILES</span></h1><div class="sub">Live UFO / UAP news, videos &amp; official records</div></header>
<div class="search"><input id="q" type="search" placeholder="Search sightings, cases, topics…" enterkeyhint="search"><button id="go">Go</button></div>
<main id="out"></main>
<nav id="nav">
<button data-t="videos" class="on"><b>🎬</b>Videos</button>
<button data-t="news"><b>📰</b>News</button>
<button data-t="reddit"><b>👽</b>Sightings</button>
<button data-t="files"><b>🗂️</b>Records</button>
</nav>
<script>
const $=s=>document.querySelector(s),out=$('#out');
let tab='videos',query='';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const s=(Date.now()-t)/1000;if(s<3600)return Math.max(1,s/60|0)+'m ago';if(s<86400)return(s/3600|0)+'h ago';return(s/86400|0)+'d ago'};
async function tryFetch(u,ms=9000){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.text()}finally{clearTimeout(id)}}
async function get(u){
 const tries=[u,'https://api.allorigins.win/raw?url='+encodeURIComponent(u),'https://corsproxy.io/?'+encodeURIComponent(u)];
 for(const t of tries){try{const x=await tryFetch(t);if(x&&x.length>50)return x}catch(e){}}
 throw new Error('offline');
}
async function cached(key,fn){
 try{const d=await fn();localStorage.setItem(key,JSON.stringify(d));return d}
 catch(e){const c=localStorage.getItem(key);if(c)return JSON.parse(c);throw e}
}
function redditUrl(){
 const b='https://www.reddit.com/r/UFOs+UAP+UFOB/';
 return query?b+'search.json?restrict_sr=1&sort=relevance&t=year&limit=60&raw_json=1&q='+encodeURIComponent(query):b+'hot.json?limit=75&raw_json=1';
}
const posts=()=>cached('r:'+query,async()=>JSON.parse(await get(redditUrl())).data.children.map(c=>c.data));
const news=()=>cached('n:'+query,async()=>{
 const q=encodeURIComponent((query?query+' ':'')+'(UFO OR UAP OR "unidentified anomalous") when:30d');
 const xml=new DOMParser().parseFromString(await get(`https://news.google.com/rss/search?q=${q}&hl=en-US&gl=US&ceid=US:en`),'text/xml');
 return [...xml.querySelectorAll('item')].slice(0,50).map(i=>({title:i.querySelector('title')?.textContent,link:i.querySelector('link')?.textContent,date:new Date(i.querySelector('pubDate')?.textContent).getTime(),src:i.querySelector('source')?.textContent})).sort((a,b)=>b.date-a.date);
});
function ytId(u){const m=(u||'').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m&&m[1]}
function videoCard(p){
 const meta=`<div class="meta">r/${esc(p.subreddit)} · ▲ ${p.ups} · ${ago(p.created_utc*1000)}</div>`,
 title=`<a class="t" href="https://reddit.com${p.permalink}" target="_blank" rel="noopener">${esc(p.title)}</a>`;
 const rv=p.media?.reddit_video||p.secure_media?.reddit_video;
 if(rv)return `<div class="card"><video class="vid" controls playsinline preload="none" poster="${esc((p.preview?.images?.[0]?.source?.url)||'')}" src="${esc(rv.hls_url||rv.fallback_url)}"></video>${title}${meta}</div>`;
 const y=ytId(p.url);
 if(y)return `<div class="card"><iframe class="vid" loading="lazy" allowfullscreen allow="autoplay;encrypted-media;picture-in-picture" src="https://www.youtube.com/embed/${y}?playsinline=1"></iframe>${title}${meta}</div>`;
 return null;
}
async function render(){
 out.innerHTML='<div class="status">Scanning the skies… 🛸</div>';
 try{
  if(tab==='files'){return out.innerHTML=filesView()}
  if(tab==='news'){const n=await news();out.innerHTML=n.length?n.map(x=>`<div class="card"><a class="t" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="meta">${esc(x.src||'News')} · ${ago(x.date)}</div></div>`).join(''):'<div class="status">No news found.</div>';return}
  const p=await posts();
  if(tab==='videos'){const v=p.map(videoCard).filter(Boolean);
   out.innerHTML=`<div class="row" style="padding:6px 0"><a class="btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent((query||'')+' ufo footage')}" target="_blank" rel="noopener">▶ More on YouTube</a></div>`+(v.join('')||'<div class="status">No videos found. Try another search.</div>')}
  else out.innerHTML=p.filter(x=>!x.stickied).map(x=>`<div class="card">${x.thumbnail&&x.thumbnail.startsWith('http')?`<img class="thumb" loading="lazy" src="${esc(x.preview?.images?.[0]?.source?.url||x.thumbnail)}">`:''}<a class="t" href="https://reddit.com${x.permalink}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="meta">r/${esc(x.subreddit)} · ▲ ${x.ups} · 💬 ${x.num_comments} · ${ago(x.created_utc*1000)}</div></div>`).join('');
 }catch(e){out.innerHTML='<div class="status">Couldn\'t reach the internet right now.<br><br><button class="btn" onclick="render()">Try again</button></div>'}
}
function filesView(){
 const L=[['AARO – DoD UAP Office','https://www.aaro.mil','Official US government UAP reports & case resolutions'],
 ['NASA UAP Research','https://science.nasa.gov/uap/','NASA independent study & public data'],
 ['National Archives – UFO Records','https://www.archives.gov/research/military/air-force/ufos','Project Blue Book & declassified files'],
 ['The Black Vault','https://www.theblackvault.com','Huge FOIA document archive'],
 ['Project Blue Book Archive','https://www.bluebookarchive.org','Scanned Air Force case files'],
 ['NUFORC Sighting Database','https://nuforc.org','Public sighting reports by date & place'],
 ['Congress UAP Hearings','https://www.congress.gov/search?q=%7B%22search%22%3A%22UAP%22%7D','Official hearings & legislation'],
 ['Search Google for UFO files','https://www.google.com/search?q='+encodeURIComponent((query||'')+' UFO files declassified'),'Open web search']];
 return L.map(([a,b,c])=>`<div class="card"><a class="t" href="${b}" target="_blank" rel="noopener">${a} ↗</a><div class="meta">${c}</div></div>`).join('');
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
const doSearch=()=>{query=$('#q').value.trim();$('#q').blur();render()};
$('#go').onclick=doSearch;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab!=='files')render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
